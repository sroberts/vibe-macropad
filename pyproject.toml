[project]
name = "vibe-macropad"
version = "0.1.0"
description = "Host-side tests for the MacroPad Tally firmware"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

# The CircuitPython library bundle circup installs firmware/requirements.txt
# from, when run in this repo.
[tool.circup.bundle-versions]
"adafruit/Adafruit_CircuitPython_Bundle" = "20261023"
